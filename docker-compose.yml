name: linguacafe

networks:
    linguacafe:
        driver: bridge

services:
    webserver:
        build:
            context: .
            dockerfile: ./docker/PhpDockerfile
        container_name: linguacafe-webserver
        restart: unless-stopped
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        volumes:
            - ./storage:/var/www/html/storage
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            APP_KEY: ${APP_KEY:?Set APP_KEY before starting LinguaCafe}
            APP_URL: ${APP_URL:?Set APP_URL before starting LinguaCafe}
            DB_DATABASE: ${DB_DATABASE:-linguacafe}
            DB_USERNAME: ${DB_USERNAME:-linguacafe}
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting LinguaCafe}
            DB_HOST: ${DB_HOST:-linguacafe-database}
            DB_PORT: ${DB_PORT:-3306}
            REDIS_HOST: linguacafe-redis
            PYTHON_CONTAINER_NAME: linguacafe-python-service
            TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
            BACKUP_INTERVAL: "59 23 * * *"
            MAX_SAVED_BACKUPS: 14
        ports:
            - "6001:6001"
            - "${PORT:-9191}:80"
        networks:
            - linguacafe
        extra_hosts:
            - "host.docker.internal:host-gateway"

    mysql:
        image: mysql:8.4
        container_name: linguacafe-database
        restart: unless-stopped
        tty: true
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
            interval: 10s
            timeout: 5s
            retries: 10
        volumes:
            - ./database:/var/lib/mysql
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-linguacafe}
            MYSQL_USER: ${DB_USERNAME:-linguacafe}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting LinguaCafe}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD before starting LinguaCafe}
            SERVICE_NAME: linguacafe
        networks:
            - linguacafe

    redis:
        image: redis:7.2-alpine
        container_name: linguacafe-redis
        restart: unless-stopped
        volumes:
            - ./cache:/data
        networks:
            - linguacafe

    python:
        build:
            context: .
            dockerfile: ./docker/PythonDockerfile
        container_name: linguacafe-python-service
        command: "python3 /app/tokenizer.py"
        restart: unless-stopped
        tty: true
        environment:
            PYTHONPATH: "/var/www/html/storage/app/model"
        volumes:
            - ./storage:/var/www/html/storage
        networks:
            - linguacafe
        platform: ${PLATFORM:-}
