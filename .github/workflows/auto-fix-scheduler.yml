name: Auto-Fix Scheduler

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Compatibility carrier input; unused by iOS acceptance'
        required: true
        type: string
      attempt:
        description: 'Compatibility carrier input; offline maps to offline focus, anything else to full'
        required: true
        type: string

permissions:
  contents: read

jobs:
  ios-reader-offline-acceptance:
    uses: ./.github/workflows/ios-reader-simulator-acceptance.yml
    with:
      focus: ${{ inputs.attempt == 'offline' && 'offline' || 'full' }}
