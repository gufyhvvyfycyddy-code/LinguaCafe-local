name: iOS Xcode capability probe

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unsigned-ios-compile:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Select Xcode 26.6
        run: |
          test -d "$DEVELOPER_DIR"
          sw_vers
          node --version
          npm --version
          node -e "process.exit(Number(process.versions.node.split('.')[0]) >= 22 ? 0 : 1)"
          xcodebuild -version
          xcrun --version

      - name: Start simulator boot
        run: |
          set -euo pipefail
          SIMULATORS_JSON="$(xcrun simctl list devices available -j)"
          SIM_UDID="$(printf '%s' "$SIMULATORS_JSON" | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for runtime in data["devices"].values() for d in runtime if d.get("isAvailable") and d.get("name") == "iPhone 17 Pro Max"]; print(devices[0]["udid"] if devices else "")')"
          IPAD_UDID="$(printf '%s' "$SIMULATORS_JSON" | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for runtime in data["devices"].values() for d in runtime if d.get("isAvailable") and d.get("name", "").startswith("iPad Pro 13-inch")]; print(devices[0]["udid"] if devices else "")')"
          test -n "$SIM_UDID"
          test -n "$IPAD_UDID"
          echo "LC_IOS_SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          echo "LC_IOS_IPAD_SIM_UDID=$IPAD_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_UDID"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Run mobile tests
        working-directory: mobile
        run: npm test

      - name: Generate iOS Web assets
        working-directory: mobile
        run: npm run cap:sync:ios

      - name: Verify generated iOS Web assets
        working-directory: mobile
        run: npm run ios:generated-web-integrity

      - name: Verify iOS source and release contracts
        run: node tests/js/M9IosMvpGuard.test.mjs

      - name: Resolve Swift packages and list simulators
        working-directory: mobile/ios/App
        run: |
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
          xcrun simctl list devices available

      - name: Compile unsigned iOS Simulator app
        working-directory: mobile/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/LinguaCafeDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_BUNDLE="$RUNNER_TEMP/LinguaCafeDerivedData/Build/Products/Debug-iphonesimulator/App.app"
          APP_PLIST="$APP_BUNDLE/Info.plist"
          PRIVACY_PLIST="$APP_BUNDLE/PrivacyInfo.xcprivacy"
          test -f "$APP_PLIST"
          test -f "$PRIVACY_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")" = "1.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")" = "1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP_PLIST")" = "false"
          python3 - "$PRIVACY_PLIST" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], 'rb') as handle:
              privacy = plistlib.load(handle)
          actual = {item['NSPrivacyCollectedDataType'] for item in privacy['NSPrivacyCollectedDataTypes']}
          expected = {
              'NSPrivacyCollectedDataTypeEmailAddress',
              'NSPrivacyCollectedDataTypeDeviceID',
              'NSPrivacyCollectedDataTypeOtherUserContent',
              'NSPrivacyCollectedDataTypeProductInteraction',
              'NSPrivacyCollectedDataTypeSearchHistory',
              'NSPrivacyCollectedDataTypeOtherDiagnosticData',
          }
          if actual != expected:
              raise SystemExit(f'Unexpected bundled privacy data types: {sorted(actual)}')
          expected_accessed_apis = [{
              'NSPrivacyAccessedAPIType': 'NSPrivacyAccessedAPICategoryUserDefaults',
              'NSPrivacyAccessedAPITypeReasons': ['CA92.1'],
          }]
          if privacy.get('NSPrivacyAccessedAPITypes') != expected_accessed_apis:
              raise SystemExit(f"Unexpected bundled required-reason APIs: {privacy.get('NSPrivacyAccessedAPITypes')}")
          if privacy.get('NSPrivacyTracking') is not False:
              raise SystemExit('Bundled privacy manifest must keep tracking disabled')
          if privacy.get('NSPrivacyTrackingDomains') != []:
              raise SystemExit('Bundled privacy manifest must keep tracking domains empty')
          PY

      - name: Compile unsigned Release iOS archive
        working-directory: mobile/ios/App
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/LinguaCafeUnsigned.xcarchive"
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/LinguaCafeArchiveDerivedData" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            archive
          ARCHIVE_PLIST="$ARCHIVE_PATH/Info.plist"
          ARCHIVE_APP="$ARCHIVE_PATH/Products/Applications/App.app"
          test -f "$ARCHIVE_PLIST"
          test -d "$ARCHIVE_APP"
          test -f "$ARCHIVE_APP/Info.plist"
          test -f "$ARCHIVE_APP/PrivacyInfo.xcprivacy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$ARCHIVE_PLIST")" = "com.linguacafe.mobile"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$ARCHIVE_APP/Info.plist")" = "com.linguacafe.mobile"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$ARCHIVE_APP/Info.plist")" = "LinguaCafe"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$ARCHIVE_APP/Info.plist")" = "1.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$ARCHIVE_APP/Info.plist")" = "1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$ARCHIVE_APP/Info.plist")" = "false"
          python3 - "$ARCHIVE_APP/PrivacyInfo.xcprivacy" "App/PrivacyInfo.xcprivacy" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], 'rb') as handle:
              archived = plistlib.load(handle)
          with open(sys.argv[2], 'rb') as handle:
              source = plistlib.load(handle)
          if archived != source:
              raise SystemExit('Archived PrivacyInfo.xcprivacy differs semantically from source')
          PY
          python3 - \
            "$ARCHIVE_APP/Frameworks/Capacitor.framework/PrivacyInfo.xcprivacy" \
            "$ARCHIVE_APP/Frameworks/Cordova.framework/PrivacyInfo.xcprivacy" <<'PY'
          import plistlib
          import sys

          required_keys = {
              'NSPrivacyAccessedAPITypes',
              'NSPrivacyCollectedDataTypes',
              'NSPrivacyTrackingDomains',
              'NSPrivacyTracking',
          }
          for path in sys.argv[1:]:
              with open(path, 'rb') as handle:
                  manifest = plistlib.load(handle)
              if not required_keys.issubset(manifest):
                  raise SystemExit(f'SDK privacy manifest missing required keys: {path}')
              if manifest['NSPrivacyTracking'] is not False:
                  raise SystemExit(f'SDK privacy manifest must keep tracking disabled: {path}')
              for key in ('NSPrivacyAccessedAPITypes', 'NSPrivacyCollectedDataTypes', 'NSPrivacyTrackingDomains'):
                  if not isinstance(manifest[key], list):
                      raise SystemExit(f'SDK privacy manifest key must be an array: {path} {key}')
          PY

      - name: Install pinned Maestro CLI for rendered smoke
        run: |
          set -euo pipefail
          curl -fL "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.7.0/maestro.zip" -o "$RUNNER_TEMP/maestro.zip"
          echo "a4ccab6b604617e7aef6db4f885666056eabe5cfa32befaa3bc994041b8fcbb5  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/maestro"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          MAESTRO_BIN="$(find "$RUNNER_TEMP/maestro" -type f -path '*/bin/maestro' | head -1)"
          test -n "$MAESTRO_BIN"
          chmod +x "$MAESTRO_BIN"
          echo "MAESTRO_BIN=$MAESTRO_BIN" >> "$GITHUB_ENV"
          java -version
          "$MAESTRO_BIN" --version

      - name: Wait for simulator and launch app
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$LC_IOS_SIM_UDID" -b
          APP_PATH="$RUNNER_TEMP/LinguaCafeDerivedData/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          xcrun simctl install "$LC_IOS_SIM_UDID" "$APP_PATH"
          xcrun simctl get_app_container "$LC_IOS_SIM_UDID" com.linguacafe.mobile app
          xcrun simctl launch "$LC_IOS_SIM_UDID" com.linguacafe.mobile
          sleep 5

      - name: Run rendered iOS login-shell smoke
        run: |
          set -euo pipefail
          FLOW="$RUNNER_TEMP/ios-login-shell.yaml"
          "$MAESTRO_BIN" --device="$LC_IOS_SIM_UDID" hierarchy
          printf '%s\n' \
            'appId: com.linguacafe.mobile' \
            '---' \
            '- launchApp:' \
            '    clearState: true' \
            '    clearKeychain: true' \
            '- assertVisible: "LinguaCafe"' \
            '- extendedWaitUntil:' \
            '    visible: "IOS · CONNECTED MVP"' \
            '    timeout: 30000' \
            '- assertVisible: "IOS · CONNECTED MVP"' \
            '- assertVisible: "继续学习"' \
            '- assertVisible: "服务器地址"' \
            '- assertVisible: "邮箱"' \
            '- assertVisible: "密码"' \
            '- assertVisible: "安全登录"' \
            '- assertVisible: "设备令牌由系统 Keychain 保护；应用不会保存密码。"' \
            '- tapOn: "https://learn.example.com"' \
            '- inputText: "http://127.0.0.1:8878"' \
            '- assertVisible: "http://127.0.0.1:8878"' \
            '- assertVisible: "仅用于本地调试；Android/iOS 正式版可能拒绝明文连接；正式使用应配置 HTTPS。"' \
            > "$FLOW"
          "$MAESTRO_BIN" --device="$LC_IOS_SIM_UDID" test "$FLOW"
          IPHONE_SCREENSHOT="$RUNNER_TEMP/iphone-69-login-shell.jpg"
          xcrun simctl io "$LC_IOS_SIM_UDID" screenshot --type=jpeg "$IPHONE_SCREENSHOT"
          WIDTH="$(sips -g pixelWidth "$IPHONE_SCREENSHOT" | awk '/pixelWidth/ {print $2}')"
          HEIGHT="$(sips -g pixelHeight "$IPHONE_SCREENSHOT" | awk '/pixelHeight/ {print $2}')"
          FORMAT="$(sips -g format "$IPHONE_SCREENSHOT" | awk '/format/ {print $2}')"
          HAS_ALPHA="$(sips -g hasAlpha "$IPHONE_SCREENSHOT" | awk '/hasAlpha/ {print $2}')"
          printf '6.9-inch iPhone screenshot: %sx%s format=%s alpha=%s\n' "$WIDTH" "$HEIGHT" "$FORMAT" "$HAS_ALPHA"
          test "$FORMAT" = "jpeg"
          test "$HAS_ALPHA" = "no"
          case "${WIDTH}x${HEIGHT}" in
            1260x2736|1290x2796|1320x2868) ;;
            *) echo 'Unexpected 6.9-inch iPhone screenshot size.' >&2; exit 1 ;;
          esac

      - name: Run rendered 13-inch iPad login-shell smoke
        run: |
          set -euo pipefail
          xcrun simctl terminate "$LC_IOS_SIM_UDID" com.linguacafe.mobile || true
          xcrun simctl shutdown "$LC_IOS_SIM_UDID"
          xcrun simctl boot "$LC_IOS_IPAD_SIM_UDID"
          xcrun simctl bootstatus "$LC_IOS_IPAD_SIM_UDID" -b
          APP_PATH="$RUNNER_TEMP/LinguaCafeDerivedData/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          xcrun simctl install "$LC_IOS_IPAD_SIM_UDID" "$APP_PATH"
          xcrun simctl launch "$LC_IOS_IPAD_SIM_UDID" com.linguacafe.mobile
          "$MAESTRO_BIN" --device="$LC_IOS_IPAD_SIM_UDID" test "$RUNNER_TEMP/ios-login-shell.yaml"
          IPAD_SCREENSHOT="$RUNNER_TEMP/ipad-13-login-shell.jpg"
          xcrun simctl io "$LC_IOS_IPAD_SIM_UDID" screenshot --type=jpeg "$IPAD_SCREENSHOT"
          WIDTH="$(sips -g pixelWidth "$IPAD_SCREENSHOT" | awk '/pixelWidth/ {print $2}')"
          HEIGHT="$(sips -g pixelHeight "$IPAD_SCREENSHOT" | awk '/pixelHeight/ {print $2}')"
          FORMAT="$(sips -g format "$IPAD_SCREENSHOT" | awk '/format/ {print $2}')"
          HAS_ALPHA="$(sips -g hasAlpha "$IPAD_SCREENSHOT" | awk '/hasAlpha/ {print $2}')"
          printf '13-inch iPad screenshot: %sx%s format=%s alpha=%s\n' "$WIDTH" "$HEIGHT" "$FORMAT" "$HAS_ALPHA"
          test "$FORMAT" = "jpeg"
          test "$HAS_ALPHA" = "no"
          case "${WIDTH}x${HEIGHT}" in
            2064x2752|2048x2732) ;;
            *) echo 'Unexpected 13-inch iPad screenshot size.' >&2; exit 1 ;;
          esac

      - name: Shut down simulators
        if: always()
        run: |
          if [ -n "${LC_IOS_SIM_UDID:-}" ]; then
            xcrun simctl terminate "$LC_IOS_SIM_UDID" com.linguacafe.mobile || true
            xcrun simctl shutdown "$LC_IOS_SIM_UDID" || true
          fi
          if [ -n "${LC_IOS_IPAD_SIM_UDID:-}" ]; then
            xcrun simctl terminate "$LC_IOS_IPAD_SIM_UDID" com.linguacafe.mobile || true
            xcrun simctl shutdown "$LC_IOS_IPAD_SIM_UDID" || true
          fi
